<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    :root { color: #17211c; background: #f6f8f5; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { color: #edf4ee; background: #141c18; }
    }
    body {
      margin: 0;
      box-sizing: border-box;
      min-block-size: 100vh;
      padding: 1rem;
      display: grid;
      place-items: center;
    }
    h1 {
      margin: 0;
      font: 600 clamp(1.25rem, 3vw, 2rem)/1.3 system-ui, sans-serif;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body><h1>Hello from Rex WebView!</h1></body>
</html>
